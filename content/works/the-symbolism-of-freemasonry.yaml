summary: >
  Thirty-one short chapters on Masonic symbolism — the lodge, the
  point within a circle, the ladder, the legend of the third degree, the lost
  word — interpreting each as part of a single moral and religious allegory.
historical_context: >
  Mackey was the most prolific American Masonic writer of the nineteenth
  century. The book was entered for copyright in 1869; this transcription is of
  an 1882 printing. It draws throughout on comparisons with ancient mysteries,
  a mode of interpretation shared with much of the Rosicrucian and Hermetic
  literature in the archive.
archivist_notes: >
  Mackey's chapters are compact and can be read in any order. Compare his
  treatment of the "spurious Freemasonry" of antiquity with Silberer's chapter
  on Rosicrucianism and Freemasonry (FILE 0004).
archivist_questions:
  - What is the "lost word" in Masonic symbolism?
  - How does Mackey connect Freemasonry to the ancient mysteries?
  - What does the point within a circle symbolise?

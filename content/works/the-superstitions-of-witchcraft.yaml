summary: >
  A review of witchcraft belief across three ages — "earlier", "mediaeval" and
  "modern" faith — from classical sorcery through the demonology of the Church
  to the great persecutions of the sixteenth and seventeenth centuries.
historical_context: >
  Published in London by Longman in 1865. The preface frames witchcraft as a
  creed that "in the seventeenth century was a living and lively faith", and
  the book is a Victorian attempt at a complete natural history of that faith.
archivist_notes: >
  The three-part structure makes this the archive's best overview; use it
  before the specialist histories.
archivist_questions:
  - How did belief in witchcraft change from antiquity to the seventeenth century?
  - What powers were witches believed to possess?
  - How does Williams explain the persecutions?

summary: >
  A survey of those who claimed, or were accused of, magical power — from the
  Magi and the oracles of Greece through medieval sorcerers and Renaissance
  magi. Godwin's declared purpose, in his preface, is "to exhibit a fair
  delineation of the credulity of the human mind".
historical_context: >
  Godwin, the radical philosopher of Political Justice, wrote this late work as
  a rationalist's history. It is nonetheless a compendium of the lore it sets
  out to explain, and it opens with a taxonomy of the arts — augury,
  chiromancy, astrology, necromancy, alchemy — that reads like a map of the
  whole field.
archivist_notes: >
  The opening sections (divination, sorcery, compacts with the Devil, imps,
  talismans) work as a glossary for the rest of the archive.
archivist_questions:
  - How does Godwin distinguish sorcery, witchcraft and necromancy?
  - What does Godwin say about the Rosicrucians?
  - Which figures does Godwin treat as the most eminent magicians?

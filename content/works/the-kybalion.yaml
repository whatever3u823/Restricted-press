summary: >
  A compact exposition of seven "Hermetic Principles" — Mentalism,
  Correspondence, Vibration, Polarity, Rhythm, Cause and Effect, and Gender —
  presented as the teaching of Hermes Trismegistus, with each chapter glossing
  axioms quoted from a work the authors call "The Kybalion".
historical_context: >
  Published in Chicago by the Yogi Publication Society under the pseudonym
  "Three Initiates" and dedicated to Hermes Trismegistus. It belongs to the
  American New Thought movement of the early twentieth century as much as to
  older Hermetic literature, and has been continuously reprinted since.
archivist_notes: >
  The source of the "Kybalion" axioms is not documented outside this book.
  Compare its Hermeticism with the older alchemical and Rosicrucian material in
  Silberer (FILE 0004) and Muir (FILE 0011).
archivist_questions:
  - What are the seven Hermetic Principles?
  - What does The Kybalion mean by "mental transmutation"?
  - How does The Kybalion describe "The All"?

summary: >
  A chemist's account of alchemical theory — the unity of nature, the
  elements and principles, the "essence", the language of the adepts — and of
  how the search for the one thing gave way to the chemistry of elements and
  combustion.
historical_context: >
  The preface is dated Cambridge, November 1902, and a note to the "New and
  Enlarged Edition" is dated September 1913. Muir quotes the alchemists at
  length, which makes the book an anthology of alchemical language as well as a
  history of it.
archivist_notes: >
  Chapter VII, "The Language of Alchemy", is the best entry point. The original
  edition's eighteen illustrations are not reproduced in the reading text;
  four appear as plates in this dossier.
archivist_questions:
  - What did alchemists mean by the "philosopher's stone"?
  - How did Paracelsus change alchemy?
  - Why was alchemical language deliberately obscure?

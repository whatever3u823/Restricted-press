summary: >
  Dee's own terse diary entries — births, debts, dreams, visitors, weather,
  journeys and quarrels — printed from the manuscripts, with the catalogue
  of the manuscripts in his library. The most private document in the archive.
historical_context: >
  Edited by James Orchard Halliwell from manuscripts in the Ashmolean Museum at
  Oxford and Trinity College Library, Cambridge, and printed for the Camden
  Society in 1842. The diary shows the scholar-magician in domestic scale; the
  transcription preserves Dee's occasional use of Greek letters to write
  English words.
archivist_notes: >
  Entries are brief and often cryptic. Search for names (Kelley, the Queen),
  for places (Mortlake), or for words like "dreamed".
archivist_questions:
  - What does Dee record about Edward Kelley?
  - What does Dee's diary say about his dreams?
  - What does the diary reveal about Dee's relationship with Queen Elizabeth?

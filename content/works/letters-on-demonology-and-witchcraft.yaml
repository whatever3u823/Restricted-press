summary: >
  Ten letters in which Scott, writing as antiquary rather than novelist,
  examines belief in apparitions, fairies, demons and witches, and the
  prosecutions that belief produced in England and Scotland.
historical_context: >
  According to Henry Morley's introduction to this edition, the Letters were
  written and published in 1830 as Scott's contribution to John Murray's
  "Family Library", a series of inexpensive five-shilling volumes. Scott treats
  the witch trials as a historical aberration to be explained, drawing freely
  on Scottish cases and his own collection of folklore.
archivist_notes: >
  Letter VIII's account of Matthew Hopkins pairs well with Notestein's chapter
  on the same figure (FILE 0007).
archivist_questions:
  - How does Scott explain belief in apparitions?
  - What does Scott say about Matthew Hopkins, the Witchfinder General?
  - How does Scott connect fairy belief to witchcraft?

summary: >
  A documentary history of English witchcraft prosecution from the accession
  of Elizabeth to the last trials, built from pamphlets, court records and the
  controversial literature of the period, with chapters on Reginald Scot,
  James I, the Lancashire witches and Matthew Hopkins.
historical_context: >
  Awarded the American Historical Association's Herbert Baxter Adams Prize in
  European History for 1909 and published by the Association in 1911. It was
  among the first scholarly histories to treat English witchcraft through
  systematic use of the trial pamphlets.
archivist_notes: >
  Chapter VIII (Matthew Hopkins) and Chapter XII (Glanvill and Webster) are
  natural companions to Scott's Letters (FILE 0003) and Roberts's Treatise
  (FILE 0001), which is itself a primary source of the kind Notestein used.
archivist_questions:
  - Who was Matthew Hopkins and how did his campaign operate?
  - How did James I influence English witchcraft prosecution?
  - Why did witchcraft trials decline in England?

summary: >
  A clergyman's treatise setting out, proposition by proposition, the nature
  of witchcraft and the proofs of its reality, followed by an account of Mary
  Smith of King's Lynn, "wife of Henry Smith Glouer", drawn from her
  confession and from the examination of witnesses, and of her execution.
historical_context: >
  Published in London in 1616, in the reign of James I, whose own Daemonologie
  (1597) had lent royal authority to belief in witchcraft. Roberts writes as a
  minister addressing the mayor, recorder, aldermen and inhabitants of King's
  Lynn, and pairs doctrinal argument with a local case. The transcription keeps
  the original spelling — u for v, i for j — and the printer's abbreviations.
archivist_notes: >
  Read the dedicatory epistle first: it frames the treatise as a response to a
  specific local prosecution. The propositions then move from definition
  (what witchcraft is and who practises it) to justification of punishment.
archivist_questions:
  - How does Roberts define a witch, and what powers does he allow the Devil?
  - What evidence against Mary Smith does the narrative rely on?
  - How does Roberts justify the death penalty for witchcraft?

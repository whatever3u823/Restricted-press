summary: >
  The confessions of accused witches, taken under torture, and depositions
  from the records of the Royal Court of Guernsey, printed in the original
  French with English translations and an introduction on witchcraft in
  Guernsey and Jersey.
historical_context: >
  Pitts prints records from the 1617 proceedings, including the sentence of
  death and the confessions of Collette du Mont, Marie Becquet and Isabel
  Becquet, together with a list of witchcraft trials in Guernsey from 1563 to
  1634.
archivist_notes: >
  The closest thing in the archive to raw trial testimony. Read each French
  record against its translation; the confessions describe sabbaths,
  the Devil appearing as a cat or a dog, and the marks searched for on the
  accused, in the accused's own reported words.
archivist_questions:
  - What did Collette du Mont confess to the Royal Court?
  - What happened at the sabbath according to the Guernsey confessions?
  - How many witchcraft trials took place in Guernsey between 1563 and 1634?

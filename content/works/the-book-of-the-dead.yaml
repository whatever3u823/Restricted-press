summary: >
  Budge's introduction to the collection of Egyptian funerary texts — spells,
  hymns, litanies and "words of power" — that he calls the Book of the Dead:
  its title, its history and recensions, and the beliefs about the afterlife it
  expresses.
historical_context: >
  The text is signed by Budge at the Department of Egyptian and Assyrian
  Antiquities, British Museum, and dated April 15, 1920. Budge opens by noting
  that the title "Book of the Dead" is "somewhat unsatisfactory and misleading",
  since the texts neither form a connected work nor belong to one period.
archivist_notes: >
  This is a short introductory work rather than Budge's full translation.
  It explains the vocabulary the archive's other writers use when they invoke
  Egypt.
archivist_questions:
  - Why does Budge call the title "Book of the Dead" misleading?
  - What are the "words of power" in Egyptian funerary texts?
  - How did the Egyptians imagine the Tuat?

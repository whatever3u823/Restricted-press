summary: >
  An introductory statement of the teachings of Heindel's Rosicrucian
  Fellowship: the Order of Rosicrucians, the problem of life and its solution,
  the visible and invisible worlds, the constitution of man, and life and death.
historical_context: >
  Heindel founded the Rosicrucian Fellowship, which the text says was founded
  in 1909 and headquartered at Oceanside, California, from 1911. The book
  presents a modern Rosicrucianism shaped by Theosophy; it should not be
  confused with the seventeenth-century Rosicrucian manifestos, which it
  interprets rather than reproduces.
archivist_notes: >
  The transcription is of a third edition that includes a description of the
  Fellowship's headquarters dated as late as January 1921. Front and back matter
  include the Fellowship's own advertisements, which have been excluded.
archivist_questions:
  - What does Heindel say the Rosicrucian Order is?
  - How does Heindel describe the invisible worlds?
  - What happens after death according to The Rosicrucian Mysteries?

featured: true
summary: >
  Silberer takes a single allegorical "Parable" from the Hermetic tradition and
  reads it three ways — psychoanalytically, as alchemy, and as a mystical
  path of introversion and regeneration — to argue that one symbol can carry
  several true interpretations at once.
historical_context: >
  Written in Vienna in the circle of early psychoanalysis and published in
  German as Probleme der Mystik und ihrer Symbolik. This English translation by
  Smith Ely Jelliffe was published by Moffat, Yard and Company in New York in
  1917; the archive text was transcribed from a 1971 Dover reprint that
  describes itself as an unaltered republication of that 1917 edition.
archivist_notes: >
  The Parable itself is short and comes first; the rest of the book is
  commentary on it. Part II, Section III ("The Hermetic Art") and Section IV
  ("Rosicrucianism and Freemasonry") are the densest on symbolism.
archivist_questions:
  - What is Silberer's "Parable" and how does he interpret it?
  - How does Silberer relate alchemy to psychoanalysis?
  - What does Silberer mean by "multiple interpretation"?

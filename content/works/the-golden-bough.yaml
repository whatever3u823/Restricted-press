summary: >
  Frazer sets out to explain the rule of succession to the priesthood of Diana
  at Aricia — the priest who must slay his predecessor — and in doing so
  assembles a vast comparative survey of sympathetic magic, sacred kingship,
  tree worship, dying and reviving gods, scapegoats and fire festivals.
historical_context: >
  In his preface to this abridgment Frazer explains that the "two volumes of
  the original work have expanded into twelve", and that the single-volume
  version sacrifices all notes and exact references while adding no new matter.
  The book's distinction between magic, religion and science became one of the
  most influential — and contested — ideas in modern anthropology.
archivist_notes: >
  Chapter III, "Sympathetic Magic", defines homoeopathic and contagious magic;
  the terms recur throughout the archive. The abridgment has no footnotes:
  Frazer directs readers to the twelve-volume edition for sources.
archivist_questions:
  - What is the difference between homoeopathic and contagious magic?
  - Why does Frazer think the priest of Nemi had to be killed?
  - How does Frazer distinguish magic from religion?

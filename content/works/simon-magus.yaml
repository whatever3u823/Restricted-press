summary: >
  Mead gathers the patristic and legendary sources on Simon, the magician
  rebuked by Peter in Acts, reviews the scholarly authorities, and then attempts
  to reconstruct "the Theosophy of Simon" as a serious Gnostic philosophy.
historical_context: >
  Mead was secretary to Helena Blavatsky and a leading scholar within the
  Theosophical Society. This early essay anticipates his later translations of
  Gnostic and Hermetic texts, and is characteristic of the Theosophical project
  of recovering heretics as bearers of an ancient wisdom.
archivist_notes: >
  Part I (Sources of Information) collects the ancient testimony and is the
  most useful for research; Part III is Mead's own interpretation.
archivist_questions:
  - What do the ancient sources say about Simon Magus?
  - How does Mead reconstruct Simon's philosophy?
  - What is the legend of Simon's flight at Rome?

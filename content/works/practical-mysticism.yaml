summary: >
  A short, direct guide to the contemplative life for readers without
  religious vocation: what mysticism is, the preparation of the mystic,
  meditation and recollection, and three forms of contemplation.
historical_context: >
  Underhill had already published the scholarly Mysticism (1911). This book
  addresses the same subject to the general reader; the American edition
  transcribed here was copyrighted in 1915 by E. P. Dutton.
archivist_notes: >
  The one text in the archive written as instruction rather than history or
  doctrine. Its chapters on the three forms of contemplation are short and can
  be read in sequence.
